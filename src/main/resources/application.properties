spring.application.name=bis
spring.datasource.url=jdbc:postgresql://localhost:5432/book_illustration_studio
spring.datasource.username=bookstudio
spring.datasource.password=bookstudio
spring.jpa.hibernate.ddl-auto=validate

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.jwt.secret=your-super-secret-key-at-least-32-characters-long
app.jwt.expiration-ms=86400000

app.storage.books-dir=./data/books
app.storage.images-dir=./data/images

gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=${GEMINI_API_KEY:}
gemini.model.text=gemini-3.6-flash
gemini.model.image=gemini-3.1-flash-lite-image