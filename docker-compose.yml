services:
  postgres:
    image: postgres:16-alpine
    container_name: book-studio-db
    environment:
      POSTGRES_USER: bookstudio
      POSTGRES_PASSWORD: bookstudio
      POSTGRES_DB: book_illustration_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstudio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: